[project]
name = "reorient"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.4.0",
    "imageio>=2.38.2",
    "imageio-ffmpeg>=0.8.1",
    "matplotlib>=3.11.2",
    "mujoco>=4.0.1",
    "numpy>=2.4.6",
    "pytest>=9.2.0",
    "scipy>=1.17.1",
    "stable-baselines3>=2.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reorient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
